<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký làm thẻ vật lý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <link rel="stylesheet" href="./asset/styles/feature-page.css" />
  </head>
  <body class="feature-page">
    <header class="feature-header shadow-sm py-3">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a href="index.html" class="d-inline-flex align-items-center" aria-label="Về trang chủ">
          <img src="./asset/images/vcb-main-logo.webp" alt="logo" class="img-fluid feature-logo" />
        </a>
        <a href="index.html" class="btn btn-home-white px-4 py-2 shadow-sm" aria-label="Về trang chủ">Về trang chủ</a>
      </div>
    </header>

    <main class="container py-4 py-lg-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-xl-4">
          <div class="card shadow-sm p-4 mt-3 w-100">
            <h1 class="mb-3 text-center">Yêu cầu làm thẻ vật lý</h1>

            <form id="cardForm" class="row g-3">
              <div class="col-12">
                <label class="form-label fw-bold text-dark">Họ và tên</label>
                <input id="fullname" class="form-control" required />
                <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold text-dark">Số CMND/CCCD</label>
                <input id="idNumber" class="form-control" required />
                <div class="invalid-feedback">Vui lòng nhập số CMND/CCCD.</div>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold text-dark">Địa chỉ email</label>
                <input id="email" type="email" class="form-control" required />
                <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold text-dark">Địa chỉ nhận thẻ</label>
                <textarea id="address" class="form-control" rows="2" required></textarea>
                <div class="invalid-feedback">Vui lòng nhập địa chỉ nhận thẻ.</div>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold text-dark">Loại thẻ muốn làm</label>
                <select id="cardType" class="form-select" required>
                  <option value="">-- Chọn loại thẻ --</option>
                  <option>Visa</option>
                  <option>Mastercard</option>
                  <option>Thẻ ghi nợ</option>
                  <option>Thẻ tín dụng</option>
                </select>
                <div class="invalid-feedback">Vui lòng chọn loại thẻ.</div>
              </div>

              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary w-100">Gửi yêu cầu</button>
              </div>
            </form>

            <p class="mt-3 text-muted small">Lưu ý: sau khi bấm Gửi, hệ thống sẽ gửi email yêu cầu tới ngân hàng (sử dụng EmailJS nếu cấu hình có sẵn).</p>
          </div>
        </div>
      </div>
    </main>
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="config.js"></script>
    <script>
      const form = document.getElementById("cardForm");
      const elements = form.elements;
      const fullnameInput = elements.fullname;
      const idNumberInput = elements.idNumber;
      const emailInput = elements.email;
      const addressInput = elements.address;
      const cardTypeInput = elements.cardType;
      const submitButton = form.querySelector("button[type='submit']");

      // Lấy thông số để config mail js
      const emailJsReady = typeof emailjs !== "undefined" && typeof EMAIL_PUBLIC_KEY !== "undefined" && typeof EMAIL_SERVICE_ID !== "undefined" && typeof EMAIL_TEMPLATE_ID !== "undefined";

      if (emailJsReady) {
        try {
          emailjs.init(EMAIL_PUBLIC_KEY);
        } catch (err) {
          console.warn("EmailJS init failed", err);
        }
      } else {
        console.warn("EmailJS not configured - will fallback to mailto");
      }

      function addDays(date, days) {
        return new Date(date.getTime() + days * 24 * 60 * 60 * 1000);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const fullname = fullnameInput.value.trim();
        const idNumber = idNumberInput.value.trim();
        const email = emailInput.value.trim();
        const address = addressInput.value.trim();
        const cardType = cardTypeInput.value;

        const deliveryDate = addDays(new Date(), 2);
        const deliveryStr = deliveryDate.toLocaleString();

        const title = `Yêu cầu làm thẻ vật lý - ${cardType}`;
        const message = `Họ và tên: ${fullname}\nSố CMND/CCCD: ${idNumber}\nĐịa chỉ nhận thẻ: ${address}\nLoại thẻ: ${cardType}\nNgày giao dự kiến: ${deliveryStr}`;

        // if EmailJS configured, send via EmailJS
        if (emailJsReady) {
          const params = {
            name: fullname,
            time: new Date().toLocaleString("vi-VN"),
            email: email,
            title: title,
            message: message,
          };

          submitButton.disabled = true;
          submitButton.textContent = "Đang gửi...";

          emailjs
            .send(EMAIL_SERVICE_ID, EMAIL_TEMPLATE_ID, params)
            .then(
              (response) => {
                alert("Yêu cầu đã được gửi thành công!");
                form.reset();
              },
              (error) => {
                alert("Gửi thất bại: " + (error.text || error.message || "Lỗi"));
              },
            )
            .finally(() => {
              submitButton.disabled = false;
              submitButton.textContent = "Gửi yêu cầu";
            });

          return;
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
