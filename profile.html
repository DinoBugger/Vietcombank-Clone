<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ người dùng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        background: #f8fafc;
      }
      .card {
        max-width: 720px;
        margin: 40px auto;
      }
      .label {
        font-weight: 700;
        color: #0b3b2e;
      }
      .value {
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <header class="container pt-4">
      <div class="d-flex justify-content-between align-items-center">
        <a href="index.html"><img src="./asset/images/vcb-main-logo.webp" alt="logo" style="width: 180px" /></a>
        <div>
          <a href="index.html" class="btn btn-outline-success btn-bank">Về trang chủ</a>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="card shadow-sm p-4">
        <h2 class="mb-3">Hồ sơ của tôi</h2>

        <div class="row mb-2">
          <div class="col-4 label">Họ và tên</div>
          <div class="col-8 value" id="pf-fullname">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số điện thoại</div>
          <div class="col-8 value" id="pf-phone">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số tài khoản</div>
          <div class="col-8 value" id="pf-account">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số dư</div>
          <div class="col-8 value" id="pf-balance">-</div>
        </div>

        <div class="row mb-3">
          <div class="col-4 label">Tạo lúc</div>
          <div class="col-8 value" id="pf-created">-</div>
        </div>

        <div class="d-flex">
          <button id="logoutBtn" class="btn btn-danger">Đăng xuất</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function formatBalance(raw) {
        const n = Number(raw);
        if (!Number.isFinite(n)) return "0 vnd";
        return `${n} vnd`;
      }

      function getCurrentUser() {
        try {
          return JSON.parse(localStorage.getItem("currentUser") || "null");
        } catch (e) {
          return null;
        }
      }

      const user = getCurrentUser();
      if (!user) {
        window.location.href = "./login.html";
      } else {
        document.getElementById("pf-fullname").textContent = user.fullname || "Khách hàng";
        document.getElementById("pf-phone").textContent = user.phone || "-";
        document.getElementById("pf-account").textContent = user.accountNumber || "-";
        document.getElementById("pf-balance").textContent = formatBalance(user.balance);
        document.getElementById("pf-created").textContent = user.createdAt ? new Date(user.createdAt).toLocaleString() : "-";
      }

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("currentUser");
          window.location.href = "./index.html";
        });
      }
    </script>
  </body>
</html>
