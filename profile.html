<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ người dùng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <link rel="stylesheet" href="./asset/styles/feature-page.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        background: #f8fafc;
      }
      .card {
        width: min(100%, 720px);
        margin: 24px auto 0;
      }
      .label {
        font-weight: 700;
        color: #0b3b2e;
      }
      .value {
        font-weight: 600;
      }
    </style>
  </head>

  <body class="feature-page">
    <header class="feature-header shadow-sm py-3">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a href="index.html" class="d-inline-flex align-items-center" aria-label="Về trang chủ">
          <img src="./asset/images/vcb-main-logo.webp" alt="logo" class="img-fluid feature-logo" />
        </a>
        <a href="index.html" class="btn btn-home-white px-4 py-2 shadow-sm" aria-label="Về trang chủ">Về trang chủ</a>
      </div>
    </header>

    <main class="container py-4 py-lg-5">
      <div class="card shadow-sm p-4">
        <h2 class="mb-3">Hồ sơ của tôi</h2>

        <div class="row mb-2">
          <div class="col-4 label">Họ và tên</div>
          <div class="col-8 value" id="pf-fullname">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số điện thoại</div>
          <div class="col-8 value" id="pf-phone">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số tài khoản</div>
          <div class="col-8 value" id="pf-account">-</div>
        </div>

        <div class="row mb-2">
          <div class="col-4 label">Số dư</div>
          <div class="col-8 value" id="pf-balance">-</div>
        </div>

        <div class="row mb-3">
          <div class="col-4 label">Tạo lúc</div>
          <div class="col-8 value" id="pf-created">-</div>
        </div>

        <div class="d-flex">
          <button id="logoutBtn" class="btn btn-danger">Đăng xuất</button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./asset/scripts/util.js"></script>
    <script>
      // begin logic
      const currentUser = requireCurrentUser();
      if (!currentUser) {
        throw new Error("Yêu cầu đăng nhập.");
      }
      document.getElementById("pf-fullname").textContent = currentUser.fullname || "Khách hàng";
      document.getElementById("pf-phone").textContent = currentUser.phone || "-";
      document.getElementById("pf-account").textContent = currentUser.accountNumber || "-";
      document.getElementById("pf-balance").textContent = formatMoney(currentUser.balance);
      document.getElementById("pf-created").textContent = currentUser.createdAt ? new Date(currentUser.createdAt).toLocaleString() : "-";

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("currentUser");
          window.location.href = "./index.html";
        });
      }
    </script>
  </body>
</html>
