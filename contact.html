<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Vietcombank Digital Bank</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome (CDNJS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- RESET CSS-->
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <style>
      /* Color code */
      :root {
        --vcb-primary-green: #00a651;
        --vcb-light-green: #b5d334;
        --vcb-deep-green: #00703c;
        --vcb-neutral-white: #ffffff;
        --vcb-soft-grey: #f3f4f6;
        --vcb-text-black: #111827;
      }

      /* text style */

      .body-large {
        font-size: 18px;
        line-height: 1.5;
        font-weight: 400;
      }

      .body-medium {
        font-size: 16px;
        line-height: 1.5;
        font-weight: 400;
      }

      .body-small {
        font-size: 14px;
        line-height: 1.4;
        font-weight: 400;
      }

      .button-large {
        font-size: 16px;
        line-height: 1;
        font-weight: 600;
      }

      .numeric-display {
        font-size: 20px;
        line-height: 1;
        font-weight: 700;
      }

      .input-text {
        font-size: 16px;
        line-height: 1;
        font-weight: 400;
      }

      .super-large {
        font-size: 30px;
        line-height: normal;
        font-weight: 800;
      }

      .hero-section {
        font-size: 48px;
        line-height: 1.2;
        font-weight: 700;
      }

      .section-title {
        font-size: 32px;
        line-height: 1.3;
        font-weight: 700;
      }

      .card-title {
        font-size: 24px;
        line-height: 1.4;
        font-weight: 600;
      }

      body {
        background-color: var(--vcb-soft-grey);
      }

      .contact-form-card {
        background: var(--vcb-neutral-white);
        border: 1px solid rgba(0, 112, 60, 0.14);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(17, 24, 39, 0.14);
      }

      .contact-form-card .super-large {
        color: var(--vcb-deep-green);
      }

      .contact-form-card .body-small {
        color: #4b5563 !important;
      }

      .contact-form-card .form-label {
        font-weight: 600;
        color: #1f2937;
      }
      /* Tùy chỉnh nhỏ cho Logo và Button không có sẵn trong BS5 */
      .main-logo img {
        width: 200px;
        height: auto;
      }
      .btn-vcb {
        background-color: var(--vcb-deep-green);
        color: white;
        border-radius: 10px;
        padding: 5px 15px;
        display: inline-block;
      }
      .text-vcb {
        color: var(--vcb-deep-green);
      }

      .large-button {
        width: 100%;
        color: var(--vcb-neutral-white);
        background-color: var(--vcb-primary-green);
      }

      .large-button:hover {
        background-color: var(--vcb-light-green) !important;
      }

      /* Textarea responsive */
      .form-control {
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }

      .form-control:focus {
        border-color: var(--vcb-primary-green);
        box-shadow: 0 0 0 0.2rem rgba(0, 166, 81, 0.25);
      }

      @media (max-width: 576px) {
        .contact-form-card {
          border-radius: 14px;
          box-shadow: 0 12px 28px rgba(17, 24, 39, 0.12);
        }
      }
    </style>
    <link rel="stylesheet" href="./asset/styles/feature-page.css" />
  </head>

  <body class="feature-page">
    <header class="feature-header shadow-sm py-3">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a href="index.html" class="d-inline-flex align-items-center" aria-label="Về trang chủ">
          <img src="./asset/images/vcb-main-logo.webp" alt="Vietcombank Logo" class="img-fluid feature-logo" />
        </a>
        <a href="index.html" class="btn btn-home-white px-4 py-2 shadow-sm" aria-label="Về trang chủ">Về trang chủ</a>
      </div>
    </header>

    <main class="container py-4 py-lg-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-xl-4 text-center">
          <div class="content p-4 contact-form-card w-100">
            <p class="super-large mb-2">VCB-Digitalbank</p>
            <p class="body-small text-secondary">Xin kính chào quý khách</p>
            <p class="super-large mb-3">Biểu Mẫu Tự Vấn</p>
            <form class="text-start" id="contactForm" novalidate>
              <div class="mb-2">
                <label for="fullname" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="fullname" placeholder="Họ và tên của bạn" required />
              </div>
              <div class="mb-2">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email của bạn" required />
              </div>
              <div class="mb-2">
                <label for="subject" class="form-label">Tiêu đề</label>
                <input type="text" class="form-control" id="subject" placeholder="Tiêu đề liên hệ" required />
              </div>
              <div class="mb-2">
                <label for="message" class="form-label">Nội dung</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung tin nhắn của bạn" required></textarea>
              </div>
              <button type="submit" class="btn large-button rounded-3">Gửi Đi</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- EmailJS -->

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="config.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("contactForm");
        const elements = form.elements;
        const fullnameInput = elements.fullname;
        const emailInput = elements.email;
        const subjectInput = elements.subject;
        const messageInput = elements.message;
        const submitButton = form.querySelector("button[type='submit']");

        const emailJsReady = typeof emailjs !== "undefined" && typeof EMAIL_PUBLIC_KEY !== "undefined" && typeof EMAIL_SERVICE_ID !== "undefined" && typeof EMAIL_TEMPLATE_ID !== "undefined";

        if (emailJsReady) {
          try {
            emailjs.init(EMAIL_PUBLIC_KEY);
          } catch (error) {
            console.warn("⚠️ EmailJS init failed:", error);
          }
        } else {
          console.warn("⚠️ EmailJS config is missing. Check config.js and keys.");
        }

        form.addEventListener("submit", (e) => {
          e.preventDefault();

          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }

          const nameValue = fullnameInput.value.trim();
          const emailValue = emailInput.value.trim();
          const subjectValue = subjectInput.value.trim();
          const messageValue = messageInput.value.trim();

          if (!emailJsReady) {
            alert("EmailJS chưa được cấu hình. Kiểm tra lại config.js hoặc khóa EmailJS.");
            return;
          }

          const emailParams = {
            name: nameValue,
            time: new Date().toLocaleString("vi-VN"),
            email: emailValue,
            title: subjectValue,
            message: messageValue,
          };

          submitButton.disabled = true;
          submitButton.textContent = "Đang gửi...";

          emailjs
            .send(EMAIL_SERVICE_ID, EMAIL_TEMPLATE_ID, emailParams)
            .then(
              (response) => {
                alert("Gửi liên hệ thành công!");
                form.reset();
              },
              (error) => {
                alert("Gửi thất bại: " + error.text || error.message);
              },
            )
            .finally(() => {
              submitButton.disabled = false;
              submitButton.textContent = "Gửi Đi";
            });
        });
      });
    </script>
  </body>
</html>
