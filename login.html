<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome (CDNJS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- RESET CSS-->
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <link rel="stylesheet" href="./asset/styles/auth.css" />
  </head>

  <body>
    <div class="container min-vh-100 d-flex flex-column">
      <div class="header d-flex justify-content-between align-items-center pt-5 mb-5">
        <div class="main-logo">
          <a href="index.html"> <img src="./asset/images/vcb-main-logo.webp" alt="Vietcombank Logo" /></a>
        </div>
        <div class="contact text-vcb d-flex flex-column align-items-end">
          <p class="body-large mb-1">Đường dây nóng</p>
          <p class="btn-vcb m-0">1900545413</p>
        </div>
      </div>
      <div class="row flex-grow-1 justify-content-center">
        <div class="col-12 col-md-6 col-xl-4 text-center">
          <div class="content p-4">
            <p class="super-large mb-2">VCB-Digitalbank</p>
            <p class="body-small text-secondary">Xin kính chào quý khách</p>
          </div>
          <p class="super-large mb-5">Thông tin đăng nhập</p>
          <form class="auth-form text-start" id="loginForm" novalidate>
            <div class="mb-3">
              <label for="phone" class="form-label">Số điện thoại (10 số)</label>
              <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" maxlength="10" required />
              <small class="text-danger d-none" id="phoneError">Số điện thoại phải có đúng 10 số</small>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu (ít nhất 6 kí tự)</label>
              <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" minlength="6" required />
              <small class="text-danger d-none" id="passwordError">Mật khẩu phải có ít nhất 6 kí tự</small>
            </div>
            <div class="register-link mb-3"><a href="signup.html">Chưa có tài khoản ?</a></div>
            <div><button type="submit" class="btn large-button rounded-3">Đăng nhập</button></div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./asset/scripts/util.js"></script>
    <script>
      // ============= PREPARATION
      const form = document.getElementById("loginForm");
      const elements = form.elements;
      const phoneInput = elements.phone;
      const passwordInput = elements.password;
      const phoneError = document.getElementById("phoneError");
      const passwordError = document.getElementById("passwordError");

      // ================ BEGIN
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        clearFieldMessages(phoneError, passwordError);
        clearFieldValidity(phoneInput, passwordInput);
        syncBasicValidity([
          {
            input: phoneInput,
            invalid: phoneInput.validity.valueMissing || phoneInput.validity.patternMismatch,
            message: "Số điện thoại phải có đúng 10 số",
          },
          {
            input: passwordInput,
            invalid: passwordInput.validity.valueMissing || passwordInput.validity.tooShort,
            message: "Mật khẩu phải có ít nhất 6 kí tự",
          },
        ]);

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const users = readUsers();
        const phoneValue = phoneInput.value.trim();
        const passwordValue = passwordInput.value;
        const user = users.find((entry) => entry.phone === phoneValue && entry.password === passwordValue);

        if (user) {
          alert("Đăng nhập thành công!");
          localStorage.setItem("currentUser", JSON.stringify(user));
          window.location.href = "./index.html";
        } else {
          alert("Số điện thoại hoặc mật khẩu không chính xác!");
        }
      });
    </script>
  </body>
</html>
