<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS 5.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Font Awesome (CDNJS) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- RESET CSS-->
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <link rel="stylesheet" href="./asset/styles/auth.css" />
  </head>

  <body>
    <div class="container min-vh-100 d-flex flex-column">
      <div class="header d-flex justify-content-between align-items-center pt-3 mb-2">
        <div class="main-logo">
          <a href="index.html"><img src="./asset/images/vcb-main-logo.webp" alt="Vietcombank Logo" /></a>
        </div>
        <div class="contact text-vcb d-flex flex-column align-items-end">
          <p class="body-large mb-1">Đường dây nóng</p>
          <p class="btn-vcb m-0">1900545413</p>
        </div>
      </div>
      <div class="row flex-grow-1 justify-content-center">
        <div class="col-12 col-md-6 col-xl-4 text-center">
          <div class="content p-4">
            <p class="super-large mb-2">VCB-Digitalbank</p>
            <p class="body-small text-secondary">Xin kính chào quý khách</p>
          </div>
          <p class="super-large mb-2">Thông tin đăng kí</p>
          <form class="auth-form text-start" id="signupForm" novalidate>
            <div class="mb-3">
              <label for="fullname" class="form-label">Họ và tên</label>
              <input type="text" class="form-control" id="fullname" placeholder="Họ và tên của bạn" required />
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Số điện thoại (10 số)</label>
              <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại" pattern="[0-9]{10}" maxlength="10" required />
              <small class="text-danger d-none" id="phoneError">Số điện thoại phải có đúng 10 số</small>
              <small class="text-danger d-none" id="phoneExistsError">Số điện thoại này đã được sử dụng</small>
            </div>
            <div class="mb-3">
              <label for="accountNumber" class="form-label">Số tài khoản (ít nhất 8 số)</label>
              <input type="text" class="form-control" id="accountNumber" placeholder="Nhập số tài khoản" pattern="[0-9]{8,}" maxlength="20" required />
              <small class="text-danger d-none" id="accountError">Số tài khoản phải có ít nhất 8 chữ số</small>
              <small class="text-danger d-none" id="accountExistsError">Số tài khoản này đã tồn tại</small>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu (ít nhất 6 kí tự)</label>
              <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" minlength="6" required />
              <small class="text-danger d-none" id="passwordError">Mật khẩu phải có ít nhất 6 kí tự</small>
            </div>
            <div class="mb-3">
              <label for="pin" class="form-label">Mã PIN (6 số)</label>
              <input type="text" class="form-control" id="pin" placeholder="Nhập mã pin" pattern="[0-9]{6}" maxlength="6" required />
              <small class="text-danger d-none" id="pinError">Mã PIN phải có đúng 6 số</small>
            </div>
            <div class="login-link mb-3"><a href="login.html">Đã có tài khoản ?</a></div>
            <button type="submit" class="btn large-button rounded-3">Đăng kí</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const form = document.getElementById("signupForm");
      const elements = form.elements;
      const fullnameInput = elements.fullname;
      const phoneInput = elements.phone;
      const passwordInput = elements.password;
      const pinInput = elements.pin;
      const accountInput = elements.accountNumber;
      const phoneError = document.getElementById("phoneError");
      const phoneExistsError = document.getElementById("phoneExistsError");
      const passwordError = document.getElementById("passwordError");
      const pinError = document.getElementById("pinError");
      const accountError = document.getElementById("accountError");
      const accountExistsError = document.getElementById("accountExistsError");

      function clearFieldValidity() {
        phoneInput.setCustomValidity("");
        passwordInput.setCustomValidity("");
        pinInput.setCustomValidity("");
        accountInput.setCustomValidity("");
      }

      function clearFieldMessages() {
        phoneError.classList.add("d-none");
        phoneExistsError.classList.add("d-none");
        passwordError.classList.add("d-none");
        pinError.classList.add("d-none");
        accountError.classList.add("d-none");
        accountExistsError.classList.add("d-none");
      }

      function syncBasicValidity() {
        phoneInput.setCustomValidity(phoneInput.validity.valueMissing || phoneInput.validity.patternMismatch ? "Số điện thoại phải có đúng 10 số" : "");
        passwordInput.setCustomValidity(passwordInput.validity.valueMissing || passwordInput.validity.tooShort ? "Mật khẩu phải có ít nhất 6 kí tự" : "");
        pinInput.setCustomValidity(pinInput.validity.valueMissing || pinInput.validity.patternMismatch ? "Mã PIN phải có đúng 6 số" : "");
        accountInput.setCustomValidity(accountInput.validity.valueMissing || accountInput.validity.patternMismatch ? "Số tài khoản phải có ít nhất 8 chữ số" : "");
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        clearFieldMessages();
        clearFieldValidity();
        syncBasicValidity();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const phoneValue = phoneInput.value.trim();
        const accountValue = accountInput.value.trim();
        const users = JSON.parse(localStorage.getItem("userinfo") || "[]");

        const phoneTaken = users.some((user) => String(user.phone) === String(phoneValue));
        const accountTaken = users.some((user) => String(user.accountNumber) === String(accountValue));

        if (phoneTaken) {
          phoneInput.setCustomValidity("Số điện thoại này đã được sử dụng");
          phoneExistsError.classList.remove("d-none");
        }

        if (accountTaken) {
          accountInput.setCustomValidity("Số tài khoản này đã tồn tại");
          accountExistsError.classList.remove("d-none");
        }

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const newUser = {
          id: Date.now(),
          fullname: fullnameInput.value.trim(),
          phone: phoneValue,
          password: passwordInput.value,
          pin: pinInput.value,
          accountNumber: accountValue,
          balance: 0,
          createdAt: new Date().toISOString(),
        };

        users.push(newUser);
        localStorage.setItem("userinfo", JSON.stringify(users, null, 2));

        alert("Đăng kí thành công! Chuyển hướng tới trang đăng nhập...");
        window.location.href = "./login.html";
      });
    </script>
  </body>
</html>
