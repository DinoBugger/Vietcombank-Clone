<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuyển tiền</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <style>
      :root {
        --bank-ink: #0f172a;
        --bank-green: #0f766e;
        --bank-green-deep: #064e3b;
        --bank-green-soft: #d1fae5;
        --bank-surface: rgba(255, 255, 255, 0.9);
        --bank-border: rgba(15, 118, 110, 0.14);
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        color: var(--bank-ink);
        background:
          radial-gradient(circle at top left, rgba(6, 95, 70, 0.16), transparent 28%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 26%),
          linear-gradient(180deg, #effaf7 0%, #f8fbfb 50%, #eef6f4 100%);
      }

      .page-shell {
        position: relative;
        overflow: hidden;
      }

      .page-shell::before,
      .page-shell::after {
        content: "";
        position: fixed;
        z-index: 0;
        width: 18rem;
        height: 18rem;
        border-radius: 999px;
        filter: blur(28px);
        opacity: 0.42;
        pointer-events: none;
      }

      .page-shell::before {
        top: -3rem;
        right: -4rem;
        background: rgba(15, 118, 110, 0.24);
      }

      .page-shell::after {
        left: -5rem;
        bottom: 2rem;
        background: rgba(6, 95, 70, 0.18);
      }

      .content-layer {
        position: relative;
        z-index: 1;
      }

      .hero-panel {
        background: var(--bank-surface);
        border: 1px solid var(--bank-border);
        border-radius: 28px;
        box-shadow: 0 26px 70px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: var(--bank-green-soft);
        color: var(--bank-green-deep);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .page-title {
        color: var(--bank-green-deep);
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .balance-card {
        min-width: 250px;
        border-radius: 22px;
        padding: 1.15rem 1.25rem;
        color: #fff;
        background: linear-gradient(135deg, var(--bank-green-deep), var(--bank-green));
        box-shadow: 0 18px 42px rgba(6, 78, 59, 0.26);
      }

      .balance-label {
        font-size: 0.88rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .balance-value {
        margin-top: 0.4rem;
        font-size: clamp(1.55rem, 3vw, 2.1rem);
        font-weight: 800;
        line-height: 1.1;
      }

      .form-control,
      .form-select {
        border-radius: 14px;
        border-color: rgba(15, 23, 42, 0.12);
        box-shadow: none;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: rgba(15, 118, 110, 0.42);
        box-shadow: 0 0 0 0.2rem rgba(15, 118, 110, 0.08);
      }

      .field-label {
        font-weight: 700;
        color: #0f172a;
      }

      .recipient-status {
        min-height: 1.35rem;
      }

      .btn-bank {
        border-radius: 14px;
        font-weight: 700;
        padding-inline: 1.15rem;
      }

      .btn-bank-primary {
        border: none;
        color: #fff;
        background: linear-gradient(135deg, var(--bank-green-deep), var(--bank-green));
        box-shadow: 0 16px 30px rgba(15, 118, 110, 0.22);
      }

      .btn-bank-primary:hover {
        color: #fff;
        filter: brightness(1.04);
      }

      @media (max-width: 575.98px) {
        .balance-card {
          width: 100%;
          min-width: unset;
        }
      }
    </style>
    <link rel="stylesheet" href="./asset/styles/feature-page.css" />
  </head>
  <body class="feature-page">
    <div class="page-shell">
      <header class="feature-header shadow-sm py-3 content-layer">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
          <a href="index.html" class="d-inline-flex align-items-center" aria-label="Về trang chủ">
            <img src="./asset/images/vcb-main-logo.webp" alt="Vietcombank" class="img-fluid feature-logo" />
          </a>
          <a href="index.html" class="btn btn-home-white px-4 py-2 shadow-sm" aria-label="Về trang chủ">Về trang chủ</a>
        </div>
      </header>

      <main class="container py-4 py-lg-5 content-layer">
        <div class="row justify-content-center">
          <div class="col-12 col-xl-10">
            <section class="hero-panel p-4 p-md-5">
              <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
                <div>
                  <div class="eyebrow mb-3">Chuyển tiền nội bộ</div>
                </div>
                <div class="balance-card">
                  <div class="balance-label">Số dư hiện tại</div>
                  <div id="currentBalance" class="balance-value">0 VND</div>
                </div>
              </div>

              <form id="transferForm" class="row g-4" novalidate>
                <div class="col-12">
                  <label for="recipientAccount" class="form-label field-label">Số tài khoản người nhận</label>
                  <div class="input-group input-group-lg">
                    <input
                      id="recipientAccount"
                      class="form-control"
                      type="text"
                      inputmode="numeric"
                      autocomplete="off"
                      placeholder="Nhập số tài khoản người nhận"
                      maxlength="20"
                      required
                    />
                    <button id="checkRecipientBtn" class="btn btn-outline-success btn-bank" type="button">
                      Kiểm tra
                    </button>
                  </div>
                  <div id="recipientStatus" class="recipient-status form-text mt-2 text-muted">
                    Có thể kiểm tra nhanh số tài khoản trước khi chuyển.
                  </div>
                </div>

                <div class="col-12">
                  <label for="amount" class="form-label field-label">Số tiền muốn chuyển</label>
                  <input
                    id="amount"
                    class="form-control form-control-lg"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    step="1"
                    placeholder="Ví dụ: 500000"
                    required
                  />
                  <small id="amountError" class="text-danger d-none mt-2">Vui lòng nhập số tiền là số nguyên dương.</small>
                  <small id="balanceError" class="text-danger d-none mt-2">Số dư không đủ để thực hiện giao dịch.</small>
                </div>

                <div class="col-12 d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-bank btn-bank-primary btn-lg px-4">Xác nhận chuyển tiền</button>
                  <button id="resetBtn" type="button" class="btn btn-outline-secondary btn-bank btn-lg px-4">
                    Nhập lại
                  </button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script>
      const balanceEl = document.getElementById("currentBalance");
      const form = document.getElementById("transferForm");
      const elements = form.elements;
      const recipientInput = elements.recipientAccount;
      const checkRecipientBtn = document.getElementById("checkRecipientBtn");
      const recipientStatus = document.getElementById("recipientStatus");
      const amountInput = elements.amount;
      const amountError = document.getElementById("amountError");
      const balanceError = document.getElementById("balanceError");
      const resetBtn = document.getElementById("resetBtn");

      let checkedRecipientAccount = "";

      function renderBalance() {
        const currentUser = requireCurrentUser();
        if (!currentUser) {
          return null;
        }

        balanceEl.textContent = formatMoney(currentUser.balance);
        return currentUser;
      }

      function setRecipientStatus(type, message) {
        recipientStatus.className = "recipient-status form-text mt-2";

        if (type === "success") {
          recipientStatus.classList.add("text-success");
        } else if (type === "danger") {
          recipientStatus.classList.add("text-danger");
        } else {
          recipientStatus.classList.add("text-muted");
        }

        recipientStatus.textContent = message;
      }

      function clearErrors() {
        amountError.classList.add("d-none");
        balanceError.classList.add("d-none");
      }

      function clearRecipientState() {
        checkedRecipientAccount = "";
      }

      function findRecipient(accountNumber) {
        const normalizedAccount = String(accountNumber || "").trim();
        if (!normalizedAccount) {
          return null;
        }

        return readUsers().find((user) => String(user.accountNumber) === normalizedAccount) || null;
      }

      function validateRecipientAccount() {
        const currentUser = requireCurrentUser();
        if (!currentUser) {
          return null;
        }

        const accountNumber = recipientInput.value.trim();
        recipientInput.setCustomValidity("");

        if (!/^\d{8,}$/.test(accountNumber)) {
          recipientInput.setCustomValidity("Số tài khoản phải có ít nhất 8 chữ số.");
          setRecipientStatus("danger", "Số tài khoản phải có ít nhất 8 chữ số.");
          clearRecipientState();
          return null;
        }

        if (String(accountNumber) === String(currentUser.accountNumber)) {
          recipientInput.setCustomValidity("Không thể chuyển tiền cho chính tài khoản của bạn.");
          setRecipientStatus("danger", "Không thể chuyển tiền cho chính tài khoản của bạn.");
          clearRecipientState();
          return null;
        }

        const recipient = findRecipient(accountNumber);
        if (!recipient) {
          recipientInput.setCustomValidity("Số tài khoản này không tồn tại.");
          setRecipientStatus("danger", "Số tài khoản này không tồn tại.");
          clearRecipientState();
          return null;
        }

        checkedRecipientAccount = accountNumber;
        recipientInput.setCustomValidity("");
        setRecipientStatus("success", `Đã kiểm tra: ${recipient.fullname || "Người nhận"}`);
        showRecipient(recipient);
        return recipient;
      }

      function validateTransferAmount(senderBalance) {
        const rawAmount = amountInput.value.trim();
        amountInput.setCustomValidity("");

        const transferAmount = Number(rawAmount);
        const isValidAmount = rawAmount !== "" && Number.isFinite(transferAmount) && transferAmount > 0 && /^\d+$/.test(rawAmount);

        if (!isValidAmount) {
          amountInput.setCustomValidity("Vui lòng nhập số tiền là số nguyên dương.");
          return null;
        }

        if (Number(senderBalance || 0) < transferAmount) {
          amountInput.setCustomValidity("Số dư không đủ để thực hiện giao dịch.");
          return null;
        }

        return transferAmount;
      }

      // begin logic
      const currentUser = renderBalance();
      if (currentUser) {
        clearRecipientState();
        setRecipientStatus("muted", "Có thể kiểm tra nhanh số tài khoản trước khi chuyển.");
      }

      checkRecipientBtn.addEventListener("click", () => {
        validateRecipientAccount();
        recipientInput.reportValidity();
      });

      recipientInput.addEventListener("input", () => {
        recipientInput.setCustomValidity("");
        if (recipientInput.value.trim() !== checkedRecipientAccount) {
          clearRecipientState();
          setRecipientStatus("muted", "Có thể kiểm tra nhanh số tài khoản trước khi chuyển.");
        }
      });

      amountInput.addEventListener("input", () => {
        amountInput.setCustomValidity("");
        balanceError.classList.add("d-none");
      });

      resetBtn.addEventListener("click", () => {
        form.reset();
        clearErrors();
        clearFieldValidity();
        clearRecipientState();
        setRecipientStatus("muted", "Có thể kiểm tra nhanh số tài khoản trước khi chuyển.");
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearErrors();
        clearFieldValidity();

        const latestUser = requireCurrentUser();
        if (!latestUser) {
          return;
        }

        const recipient = validateRecipientAccount();
        const transferAmount = validateTransferAmount(latestUser.balance);

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        if (!recipient || transferAmount === null) {
          form.reportValidity();
          return;
        }

        const senderBalance = Number(latestUser.balance || 0);
        if (senderBalance < transferAmount) {
          balanceError.classList.remove("d-none");
          amountInput.setCustomValidity("Số dư không đủ để thực hiện giao dịch.");
          amountInput.reportValidity();
          return;
        }

        const users = readUsers();
        const updatedUsers = users.map((user) => {
          if (
            user.id === latestUser.id ||
            user.phone === latestUser.phone ||
            String(user.accountNumber) === String(latestUser.accountNumber)
          ) {
            return {
              ...user,
              balance: Number(user.balance || 0) - transferAmount,
            };
          }

          if (String(user.accountNumber) === String(recipient.accountNumber)) {
            return {
              ...user,
              balance: Number(user.balance || 0) + transferAmount,
            };
          }

          return user;
        });

        const updatedSender = updatedUsers.find(
          (user) =>
            user.id === latestUser.id ||
            user.phone === latestUser.phone ||
            String(user.accountNumber) === String(latestUser.accountNumber),
        );

        if (!updatedSender) {
          window.location.replace("./login.html");
          return;
        }

        updateStoredUsers(updatedUsers, updatedSender);
        balanceEl.textContent = formatMoney(updatedSender.balance);

        const transferredRecipient =
          updatedUsers.find((user) => String(user.accountNumber) === String(recipient.accountNumber)) || recipient;
        const recipientName = transferredRecipient.fullname || "Người nhận";

        form.reset();
        clearFieldValidity(recipientInput, amountInput);
        clearRecipientState();
        alert(`Chuyển tiền thành công ${formatMoney(transferAmount)} cho ${recipientName}.`);
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
