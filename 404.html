<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Trang không tìm thấy</title>
    <link rel="shortcut icon" href="asset/images/vcb-icon.webp" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      :root {
        --vcb-green: #074c31;
        --vcb-green-strong: #0d6b3e;
        --vcb-green-soft: rgba(7, 76, 49, 0.12);
        --vcb-white: rgba(255, 255, 255, 0.96);
        --vcb-text: #ffffff;
        --vcb-border: rgba(255, 255, 255, 0.7);
        --vcb-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--vcb-text);
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .error-container {
        text-align: center;
        padding: 40px 20px;
        max-width: 600px;
      }

      .error-image {
        margin-bottom: 40px;
      }

      .error-image img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      .error-content {
        margin-bottom: 40px;
      }

      .error-title {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 20px 0;
        color: var(--vcb-green);
      }

      .error-submessage {
        font-size: 1.2rem;
        font-weight: 400;
        line-height: 1.6;
        color: #333333;
        margin-top: 15px;
      }

      .home-button {
        display: inline-block;
        background: linear-gradient(135deg, var(--vcb-green) 0%, var(--vcb-green-strong) 100%);
        color: var(--vcb-text);
        padding: 14px 40px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--vcb-shadow);
        text-decoration: none;
      }

      .home-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.3);
        background: linear-gradient(135deg, var(--vcb-green-strong) 0%, var(--vcb-green) 100%);
      }

      .home-button:active {
        transform: translateY(-1px);
      }

      @media (max-width: 768px) {
        .error-container {
          padding: 30px 15px;
        }

        .error-title {
          font-size: 2rem;
        }

        .error-message {
          font-size: 1rem;
        }

        .home-button {
          padding: 12px 30px;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-image">
        <img src="asset/images/vcb-404-error.webp" alt="404 Error" />
      </div>

      <div class="error-content">
        <h1 class="error-title">Rất tiếc, không tìm thấy trang</h1>
        <p class="error-submessage">Nội dung không còn tồn tại, vui lòng quay lại trang chủ.</p>
      </div>

      <a href="index.html" class="home-button"> <i class="fas fa-home"></i> Quay lại trang chủ </a>
    </div>
  </body>
</html>
