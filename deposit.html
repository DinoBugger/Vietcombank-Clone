<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nạp tiền</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./asset/styles/reset.css" />
    <style>
      :root {
        --vcb-primary-green: #00703c;
        --vcb-secondary-green: #00a651;
        --vcb-soft-green: #e9f7ef;
        --vcb-border: #d6e7dc;
        --vcb-text: #163024;
        --vcb-muted: #5f6f67;
        --vcb-white: #ffffff;
        --vcb-danger: #dc3545;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        color: var(--vcb-text);
      }

      .deposit-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .deposit-card {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(214, 231, 220, 0.9);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(16, 44, 29, 0.12);
        backdrop-filter: blur(12px);
      }

      .page-title {
        text-align: center;
        font-size: clamp(1.8rem, 3vw, 2.35rem);
        font-weight: 800;
        line-height: 1.15;
        margin: 16px 0 10px;
      }

      .page-desc {
        text-align: center;
        color: var(--vcb-muted);
        margin-bottom: 0;
      }

      .form-label {
        font-weight: 600;
      }

      .form-control {
        min-height: 52px;
        border-radius: 14px;
        border-color: var(--vcb-border);
        box-shadow: none;
      }

      .form-control:focus {
        border-color: var(--vcb-secondary-green);
        box-shadow: 0 0 0 0.2rem rgba(0, 166, 81, 0.14);
      }

      .btn-deposit {
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--vcb-primary-green), var(--vcb-secondary-green));
        color: var(--vcb-white);
        font-weight: 700;
      }

      .btn-deposit:hover {
        color: var(--vcb-white);
        filter: brightness(1.02);
      }

      .balance-box {
        margin-top: 18px;
        padding: 16px;
        border-radius: 16px;
        background: #f7fbf8;
        border: 1px solid #e1ede5;
      }

      .balance-label {
        color: var(--vcb-muted);
        font-size: 0.95rem;
      }

      .balance-value {
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--vcb-primary-green);
      }

      .back-link {
        color: var(--vcb-primary-green);
        font-weight: 600;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="./asset/styles/feature-page.css" />
  </head>
  <body class="feature-page">
    <header class="feature-header shadow-sm py-3">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a href="index.html" class="d-inline-flex align-items-center" aria-label="Về trang chủ">
          <img src="./asset/images/vcb-main-logo.webp" alt="Vietcombank Logo" class="img-fluid feature-logo" />
        </a>
        <a href="index.html" class="btn btn-home-white px-4 py-2 shadow-sm" aria-label="Về trang chủ">Về trang chủ</a>
      </div>
    </header>

    <main class="container py-2 py-lg-3">
      <section class="deposit-shell">
        <div class="deposit-card p-4 p-md-5">
          <h1 class="page-title">NẠP TIỀN</h1>
          <p class="page-desc">Nhập vào số tiền bạn muốn thêm</p>

          <div class="balance-box">
            <div class="balance-label">Số dư hiện tại</div>
            <div id="currentBalance" class="balance-value">0 VND</div>
          </div>

          <form id="depositForm" class="mt-4" novalidate>
            <div class="mb-3">
              <label for="amount" class="form-label">Số tiền muốn nạp</label>
              <input type="text" class="form-control" id="amount" inputmode="decimal" placeholder="Ví dụ: 500000" autocomplete="off" />
              <small id="amountError" class="text-danger d-none">Số tiền không hợp lệ. Vui lòng nhập số dương và không để trống.</small>
            </div>

            <button type="submit" class="btn btn-deposit w-100">Nạp tiền</button>
          </form>
        </div>
      </section>
    </main>

    <script>
      const balanceEl = document.getElementById("currentBalance");
      const form = document.getElementById("depositForm");
      const elements = form.elements;
      const amountInput = elements.amount;
      const amountError = document.getElementById("amountError");

      function getCurrentUser() {
        let currentUser = null;

        try {
          currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
        } catch (error) {
          currentUser = null;
        }

        if (!currentUser) {
          return null;
        }

        try {
          const users = JSON.parse(localStorage.getItem("userinfo") || "[]");
          const freshUser = users.find((user) => user.id === currentUser.id || user.phone === currentUser.phone);

          if (freshUser) {
            localStorage.setItem("currentUser", JSON.stringify(freshUser));
            return freshUser;
          }
        } catch (error) {
          return currentUser;
        }

        return currentUser;
      }

      function redirectIfNotLoggedIn() {
        const currentUser = getCurrentUser();

        if (!currentUser) {
          window.location.replace("./login.html");
          return null;
        }

        return currentUser;
      }

      function formatMoney(amount) {
        return `${Number(amount).toLocaleString("vi-VN")} VND`;
      }

      function renderBalance() {
        const currentUser = getCurrentUser();
        if (!currentUser) {
          return;
        }

        const balance = Number(currentUser.balance || 0);
        balanceEl.textContent = formatMoney(balance);
      }

      function updateStoredUser(nextUser) {
        const users = JSON.parse(localStorage.getItem("userinfo") || "[]");
        const updatedUsers = users.map((user) => {
          if (user.id === nextUser.id || user.phone === nextUser.phone) {
            return nextUser;
          }
          return user;
        });

        localStorage.setItem("userinfo", JSON.stringify(updatedUsers, null, 2));
        localStorage.setItem("currentUser", JSON.stringify(nextUser));
      }

      function clearAmountValidity() {
        amountInput.setCustomValidity("");
      }

      // BEGIN of Logic
      const currentUser = redirectIfNotLoggedIn();
      if (currentUser) {
        renderBalance();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        amountError.classList.add("d-none");
        clearAmountValidity();

        const rawValue = amountInput.value.trim();
        const numericValue = Number(rawValue);

        const isValidAmount = rawValue !== "" && Number.isFinite(numericValue) && numericValue > 0 && /^\d+(\.\d+)?$/.test(rawValue);

        if (!isValidAmount) {
          amountInput.setCustomValidity("Số tiền không hợp lệ. Vui lòng nhập số dương và không để trống.");
          amountInput.reportValidity();
          amountError.classList.remove("d-none");
          return;
        }

        amountInput.setCustomValidity("");

        const latestUser = getCurrentUser();
        if (!latestUser) {
          window.location.replace("./login.html");
          return;
        }

        const updatedUser = {
          ...latestUser,
          balance: Number(latestUser.balance || 0) + numericValue,
        };

        updateStoredUser(updatedUser);
        renderBalance();
        amountInput.value = "";
        clearAmountValidity();

        alert(`Nạp tiền thành công: ${formatMoney(numericValue)}`);
      });
    </script>
  </body>
</html>
